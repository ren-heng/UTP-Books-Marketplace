<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos | UTP Books Marketplace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <header>

        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

            <div class="container">

                <a class="navbar-brand fw-bold" href="index.html">
                    UTP Books Marketplace
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="menu">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="productos.html">Productos</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="carrito.html">Carrito</a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>

    <main>

        <section class="container mt-5">

            <h1 class="text-center">

                Catálogo de Productos

            </h1>

            <p class="text-center">

                Encuentra libros universitarios disponibles.

            </p>

        </section>

        <section class="container mt-5 mb-5">

            <div class="row g-4" id="listaProductos">

            </div>

        </section>

    </main>

    <footer>

        <p class="mb-1">
            UTP Books Marketplace
        </p>

        <p class="mb-0">
            © 2026 Proyecto Final - Universidad Tecnológica del Perú
        </p>

    </footer>

    <script src="js/app.js"></script>

    <script>
        const lista = document.getElementById("listaProductos");

        // Traemos los datos frescos directamente de la base de datos MySQL por PHP
        fetch("php/productos.php")
            .then(respuesta => {
                if (!respuesta.ok) {
                    throw new Error("Error al conectar con la base de datos");
                }
                return respuesta.json();
            })
            .then(datos => {
                // Guardamos los libros en la ventana global para que el carrito y los detalles los encuentren
                window.productos = datos;
                
                // Limpiamos la pantalla por si acaso
                lista.innerHTML = "";

                // Dibujamos las tarjetas directamente aquí usando los datos reales de tu base de datos
                datos.forEach(producto => {
                    lista.innerHTML += `
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm">
                            <img src="img/${producto.imagen}" 
                                 class="card-img-top object-fit-cover" 
                                 style="height: 250px;"
                                 alt="${producto.nombre}"
                                 onerror="this.src='https://placehold.co'">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <div>
                                    <h5 class="card-title fw-bold">${producto.nombre}</h5>
                                    <p class="text-muted mb-1">Autor: ${producto.autor}</p>
                                    <p class="badge bg-secondary mb-3">${producto.categoria}</p>
                                </div>
                                <div>
                                    <h4 class="text-success fw-bold">S/ ${parseFloat(producto.precio).toFixed(2)}</h4>
                                    <a href="detalle.html?id=${producto.id}" class="btn btn-primary w-100 mt-2">
                                        Ver detalle
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                });
            })
            .catch(error => {
                console.error("Error:", error);
                lista.innerHTML = `
                    <div class="col-12 text-center text-danger">
                        <p>Hubo un problema al cargar el catálogo de libros desde la base de datos.</p>
                    </div>
                `;
            });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
