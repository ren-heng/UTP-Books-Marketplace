<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | UTP Marketplace</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">

        <div class="container">

            <a class="navbar-brand logo" href="index.html">
                UTP <span>Market</span>
            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

            <!-- Menú -->
            <ul class="navbar-nav ms-4">

                <li class="nav-item">
                            <a class="nav-link active" href="index.html">Inicio</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">Productos</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="carrito.html">Carrito</a>
                        </li>

            </ul>

            <!-- Buscador -->
            <form class="d-flex ms-auto">

                <input
                    class="form-control me-2"
                    type="search"
                    placeholder="Buscar libro">

                <button
                    class="btn btn-light"
                    type="submit">

                    Buscar

                </button>

            </form>

        </div>

        </div>

    </nav>

    <!-- ================= HEADER ================= -->

    <section class="page-header">

        <div class="container">

            <h1>

                <i class="bi bi-cart3"></i>

                Mi Carrito

            </h1>

            <p>

                Revisa los productos antes de continuar.

            </p>

        </div>

    </section>

    <!-- ================= CONTENIDO ================= -->

    <section class="section">

        <div class="container">

            <div class="row">

                <!-- PRODUCTOS -->

                <div class="col-lg-8">

                    <div class="card shadow-sm border-0">

                        <div class="card-body">

                            <h4 class="mb-4">

                                Productos

                            </h4>

                            <div id="listaCarrito">

                                <!-- JavaScript insertará los productos -->

                            </div>

                        </div>

                    </div>

                </div>

                <!-- RESUMEN -->

                <div class="col-lg-4">

                    <div class="card shadow border-0 resumen">

                        <div class="card-body">

                            <h4>

                                Resumen

                            </h4>

                            <hr>

                            <div class="d-flex justify-content-between">

                                <span>Subtotal</span>

                                <strong id="subtotal">

                                    S/ 0.00

                                </strong>

                            </div>

                            <div class="d-flex justify-content-between mt-2">

                                <span>Envío</span>

                                <span class="text-success">

                                    Gratis

                                </span>

                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">

                                <h5>Total</h5>

                                <h5 id="total">

                                    S/ 0.00

                                </h5>

                            </div>
                          <div class="mb-3">

    <label class="form-label">
        Método de pago
    </label>

    <select id="metodoPago" class="form-select">

        <option value="Efectivo">Efectivo</option>
        <option value="Visa">Visa</option>
        <option value="MasterCard">MasterCard</option>
        <option value="Yape">Yape</option>
        <option value="Plin">Plin</option>

    </select>

</div>
                            <button
                                class="btn btn-danger w-100 mt-4"
                                id="btnComprar">

                                <i class="bi bi-credit-card"></i>

                                Proceder al pago

                            </button>

                            <button
                                class="btn btn-outline-danger w-100 mt-2"
                                id="vaciarCarrito">

                                Vaciar carrito

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p class="mb-1">

            UTP Books Marketplace

        </p>

        <p class="mb-0">

            © 2026 Proyecto Final - Universidad Tecnológica del Perú

        </p>

    </footer>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->

    <script src="js/carrito.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
